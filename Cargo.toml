[package]
name = "ios-signers-types"
version = "0.1.0"
edition = "2024"

[profile.release]
lto = true
codegen-units = 1
panic = 'abort'
strip = true

[[bin]]
name = "sign-util"
path = "src/cli/main.rs"
required-features = ["cli"]

[features]
default = []
cli = ["dep:clap"]

[dependencies]
anyhow = "1.0.99"
base64 = "0.22.1"
chrono = "0.4.42"
clap = { version = "4.5.45", optional = true, features = ["derive"] }
hex = "0.4.3"
md5 = "0.8.0"
obfstr = "0.4.4"
rncryptor = { git = "https://github.com/danpashin/rncryptor-rs", rev = "cd83fbe" }
serde = { version = "1.0.225", features = ["derive"] }
serde_json = "1.0.145"
url = { version = "2.5.7", features = ["serde"] }
version-compare = "0.2.0"
