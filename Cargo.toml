[package]
name = "ios-signers-types"
version = "0.1.0"
edition = "2024"

[profile.release]
lto = true
codegen-units = 1
panic = 'abort'
strip = true

[[bin]]
name = "sign-util"
path = "src/cli/main.rs"
required-features = ["cli"]

[features]
default = []
openssl = [
    "dep:openssl"
]
cli = [
    "dep:clap",
    "dep:log",
    "dep:reqwest",
    "dep:simple_logger",
    "openssl",
]

[dependencies]
anyhow = "1.0.99"
base64 = "0.22.1"
chrono = "0.4.42"
hex = "0.4.3"
md5 = "0.8.0"
obfstr = "0.4.4"
rncryptor = { git = "https://github.com/danpashin/rncryptor-rs", rev = "cd83fbe" }
serde = { version = "1.0.225", features = ["derive"] }
serde_json = "1.0.145"
url = { version = "2.5.7", features = ["serde"] }
version-compare = "0.2.0"

clap = { version = "4.5.45", optional = true, features = ["derive"] }
log = { version = "0.4.28", optional = true }
openssl = { version = "0.10.73", optional = true }
reqwest = { version = "0.12.23", features = ["blocking", "json"], optional = true }
simple_logger = { version = "5.0.0", optional = true }
