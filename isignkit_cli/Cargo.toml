[package]
name = "isignkit_cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "isignkit"
path = "src/main.rs"

[features]
default = ["openssl"]
openssl = [
    "isignkit/openssl",
    "reqwest/native-tls",
]
openssl-vendored = [
    "isignkit/openssl-vendored",
    "reqwest/native-tls-vendored",
]

[dependencies]
anyhow = "1.0.99"
chrono = "0.4.42"
clap = { version = "4.5.45", features = ["derive"] }
isignkit = { path = "../isignkit", features = ["schema"] }
log = "0.4.28"
reqwest = { version = "0.12.23", default-features = false, features = ["blocking", "json"] }
serde = "1.0.225"
serde_json = "1.0.145"
simple_logger = { version = "5.0.0", features = ["stderr"] }
url = "2.5.7"
