[package]
name = "isignkit"
version = "0.1.0"
edition = "2024"

[features]
default = []
openssl = [
    "dep:openssl"
]
openssl-vendored = [
    "dep:openssl",
    "openssl/vendored",
]
schema = [
    "dep:schemars",
    "dep:boon",
]
rocket = [
    "dep:rocket",
]

[dependencies]
thiserror = "2.0.18"
base64 = "0.22.1"
boon = { version = "0.6.1", optional = true }
chrono = { version = "0.4.44", features = ["serde"] }
codes-iso-4217 = { version = "0.1.7", features = ["serde"] }
hex = "0.4.3"
md5 = "0.8.0"
obfstr = "0.4.4"
openssl = { version = "0.10.79", optional = true }
rncryptor = { git = "https://github.com/danpashin/rncryptor-rs", rev = "cd83fbe" }
rocket = { version = "0.5.1", default-features = false, optional = true }
schemars = { version = "1.2.1", features = ["url2"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
strum = { version = "0.28.0", features = ["derive"] }
url = { version = "2.5.8", features = ["serde"] }
version-compare = "0.2.1"
